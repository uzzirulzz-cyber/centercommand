<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Playbeat Digital</title>
<style>
  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    margin: 0;
    overflow: hidden;
  }
  .logo-wrap {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top,0px) 1rem env(safe-area-inset-bottom,0px);
  }
  .stage {
    position: relative;
    width: min(225px, 88vw);
    aspect-ratio: 1 / 1;
  }
  .stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ring light-travel */
  .stage svg.ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    mix-blend-mode: screen;
  }
  .traveler {
    animation: spin 2.8s linear infinite;
    transform-origin: 627px 627px;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* the wordmark itself (PLAYBEAT DIGITAL) brightens/glows in place - no overlay layer */
  .text-glow {
    clip-path: inset(55.5% 6% 14% 6%);
  }
  .p-glow {
    clip-path: inset(19.9% 38.6% 45% 30.3%);
  }
  @keyframes textPulse {
    0%, 100% {
      filter: brightness(1) drop-shadow(0 0 0 rgba(120,200,255,0));
    }
    50% {
      filter: brightness(1.55) drop-shadow(0 0 18px rgba(150,215,255,0.95))
              drop-shadow(0 0 36px rgba(100,190,255,0.6));
    }
  }
  .text-glow,
  .p-glow {
    animation: textPulse 2.2s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) { .traveler, .text-glow, .p-glow { animation: none !important; } }
</style>
</head>
